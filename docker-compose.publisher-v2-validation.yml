# Private v2 validation only: no published ports, no external networking or Meta calls.
name: vitrine-social-publishing-v2-validation
services:
  validation_secret_init:
    image: alpine:3.21
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        mkdir -p /run/secrets-local
        test -s /run/secrets-local/db_password || (head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/secrets-local/db_password)
        test -s /run/secrets-local/db_root_password || (head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/secrets-local/db_root_password)
        test -s /run/secrets-local/app_key || (printf 'base64:' > /run/secrets-local/app_key; head -c 32 /dev/urandom | base64 | tr -d '\n' >> /run/secrets-local/app_key)
        chmod 644 /run/secrets-local/db_password /run/secrets-local/app_key
        chmod 600 /run/secrets-local/db_root_password
    volumes:
      - validation_secrets:/run/secrets-local
    networks: [validation_internal]
  validation_db:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_DATABASE: publishing_v2_validation
      MARIADB_USER: publishing_validation
      MARIADB_PASSWORD_FILE: /run/secrets-local/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets-local/db_root_password
    volumes:
      - validation_db_data:/var/lib/mysql
      - validation_secrets:/run/secrets-local:ro
    networks: [validation_internal]
    depends_on:
      validation_secret_init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  validation_redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [validation_internal]
  validation_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: validation
    restart: "no"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      SOCIAL_PUBLISHING_ENABLED: "false"
      DB_CONNECTION: mysql
      DB_HOST: validation_db
      DB_PORT: "3306"
      DB_DATABASE: publishing_v2_validation
      DB_USERNAME: publishing_validation
      REDIS_HOST: validation_redis
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
      MARKETING_ENGINE_URL: http://127.0.0.1:9/disabled
    command:
      - sh
      - -ec
      - |
        export DB_PASSWORD="$$(cat /run/secrets-local/db_password)"
        export APP_KEY="$$(cat /run/secrets-local/app_key)"
        php vendor/bin/phpunit tests/Feature/PublishingSafetyTest.php --colors=never
        exec php-fpm
    volumes:
      - validation_app_storage:/var/www/html/storage
      - validation_secrets:/run/secrets-local:ro
    networks: [validation_internal]
    depends_on:
      validation_db: {condition: service_healthy}
      validation_redis: {condition: service_started}
volumes:
  validation_db_data:
  validation_app_storage:
  validation_secrets:
networks:
  validation_internal:
    internal: true
