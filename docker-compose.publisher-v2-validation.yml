# Dedicated isolated infrastructure for publisher v2 validation. No public routes.
# Start only after .env.validation has separately provisioned credentials.
name: vitrine-social-publishing-v2-validation
services:
  validation_db:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_DATABASE: publishing_v2_validation
      MARIADB_USER: publishing_validation
      MARIADB_PASSWORD: ${VALIDATION_DB_PASSWORD:?set dedicated validation database password}
      MARIADB_ROOT_PASSWORD: ${VALIDATION_DB_ROOT_PASSWORD:?set dedicated validation root password}
    volumes:
      - validation_db_data:/var/lib/mysql
    networks: [validation_internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  validation_redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [validation_internal]
  validation_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      SOCIAL_PUBLISHING_ENABLED: "false"
      DB_CONNECTION: mysql
      DB_HOST: validation_db
      DB_PORT: "3306"
      DB_DATABASE: publishing_v2_validation
      DB_USERNAME: publishing_validation
      DB_PASSWORD: ${VALIDATION_DB_PASSWORD:?set dedicated validation database password}
      REDIS_HOST: validation_redis
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
      MARKETING_ENGINE_URL: http://127.0.0.1:9/disabled
    volumes:
      - validation_app_storage:/var/www/html/storage
    networks: [validation_internal]
    depends_on:
      validation_db: {condition: service_healthy}
      validation_redis: {condition: service_started}
volumes:
  validation_db_data:
  validation_app_storage:
networks:
  validation_internal:
    internal: true
