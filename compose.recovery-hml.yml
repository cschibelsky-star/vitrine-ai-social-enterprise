services:
  recovery_db:
    image: mariadb:11.4
    container_name: social_recovery_hml_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${RECOVERY_DB_DATABASE:-vitrine_social_recovery}
      MARIADB_USER: ${RECOVERY_DB_USERNAME:-vitrine_social_recovery}
      MARIADB_PASSWORD: ${RECOVERY_DB_PASSWORD:?RECOVERY_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${RECOVERY_DB_ROOT_PASSWORD:?RECOVERY_DB_ROOT_PASSWORD is required}
    volumes:
      - recovery_db_data:/var/lib/mysql
    networks:
      - recovery_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  recovery_redis:
    image: redis:7-alpine
    container_name: social_recovery_hml_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${RECOVERY_REDIS_PASSWORD:?RECOVERY_REDIS_PASSWORD is required}"]
    volumes:
      - recovery_redis_data:/data
    networks:
      - recovery_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RECOVERY_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      RECOVERY_REDIS_PASSWORD: ${RECOVERY_REDIS_PASSWORD:?RECOVERY_REDIS_PASSWORD is required}

  recovery_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_recovery_hml_app
    restart: unless-stopped
    environment: &app_environment
      APP_NAME: Vitrine Social Midia Recovery HML
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://social.hml.vitrineiapro.com.br
      APP_KEY: ${RECOVERY_APP_KEY:?RECOVERY_APP_KEY is required}
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: recovery_db
      DB_PORT: 3306
      DB_DATABASE: ${RECOVERY_DB_DATABASE:-vitrine_social_recovery}
      DB_USERNAME: ${RECOVERY_DB_USERNAME:-vitrine_social_recovery}
      DB_PASSWORD: ${RECOVERY_DB_PASSWORD:?RECOVERY_DB_PASSWORD is required}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      REDIS_CLIENT: phpredis
      REDIS_HOST: recovery_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${RECOVERY_REDIS_PASSWORD:?RECOVERY_REDIS_PASSWORD is required}
      FILESYSTEM_DISK: public
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-vitrineiapro@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Vitrine Social Midia}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v23.0}
      INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
      INFINITEPAY_LINKS_URL: ${INFINITEPAY_LINKS_URL:-https://api.checkout.infinitepay.io/links}
      INFINITEPAY_PAYMENT_CHECK_URL: ${INFINITEPAY_PAYMENT_CHECK_URL:-https://api.checkout.infinitepay.io/payment_check}
      INFINITEPAY_REDIRECT_URL: ${INFINITEPAY_REDIRECT_URL:-}
      INFINITEPAY_WEBHOOK_URL: ${INFINITEPAY_WEBHOOK_URL:-}
      INFINITEPAY_TIMEOUT: ${INFINITEPAY_TIMEOUT:-15}
      MARKETING_ENGINE_TOKEN: ${MARKETING_ENGINE_TOKEN:?MARKETING_ENGINE_TOKEN is required}
      MARKETING_ENGINE_URL: http://vitrine_marketing_web_internal_hml/api/internal/marketing/media/image
      MARKETING_ENGINE_PROJECT_ID: vitrine-ai-social-enterprise
      CENTRO_IA_URL: ${CENTRO_IA_URL:-http://vitrine_core_web_hml/api/internal/centro-ia/execute}
      CENTRO_IA_INTERNAL_TOKEN: ${CENTRO_IA_INTERNAL_TOKEN:-}
      CENTRO_IA_PROJECT_ID: ${CENTRO_IA_PROJECT_ID:-vitrine-ai-social-enterprise}
      CENTRO_IA_CAPABILITY: ${CENTRO_IA_CAPABILITY:-social_content_generation}
      CENTRO_IA_TIMEOUT: ${CENTRO_IA_TIMEOUT:-30}
    volumes:
      - ./:/var/www/html
      - recovery_vendor:/var/www/html/vendor
      - recovery_storage:/var/www/html/storage
    depends_on:
      recovery_db:
        condition: service_healthy
      recovery_redis:
        condition: service_healthy
    networks:
      - recovery_internal
      - vitrine_net

  recovery_web:
    image: nginx:stable
    container_name: social_recovery_hml_web
    restart: unless-stopped
    depends_on:
      - recovery_app
    ports:
      - "127.0.0.1:18090:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - recovery_storage:/var/www/html/storage:ro
    networks:
      - recovery_internal
      - traefik_public

  recovery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_recovery_hml_worker
    restart: unless-stopped
    environment: *app_environment
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=120 --max-time=3600
    volumes:
      - ./:/var/www/html
      - recovery_vendor:/var/www/html/vendor
      - recovery_storage:/var/www/html/storage
    depends_on:
      recovery_db:
        condition: service_healthy
      recovery_redis:
        condition: service_healthy
    networks:
      - recovery_internal
      - vitrine_net

  recovery_centro_ia_probe:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["diagnostic"]
    environment: *app_environment
    command:
      - php
      - -r
      - |
        require 'vendor/autoload.php';
        $$app = require 'bootstrap/app.php';
        $$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
        $$project = new App\Models\ContentProject();
        $$project->idea = 'Teste tecnico final da integracao do Vitrine Social Midia com o Centro IA.';
        $$project->objective = 'engagement';
        $$project->format = 'feed_post';
        $$project->channel = 'instagram';
        $$service = app(App\Services\AI\AiContentService::class);
        $$method = new ReflectionMethod($$service, 'generateWithCentroIa');
        $$method->setAccessible(true);
        $$result = $$method->invoke($$service, $$project, null, null);
        $$output = is_array($$result) ? ($$result['output'] ?? null) : null;
        echo json_encode([
          'ok' => is_array($$output),
          'provider' => is_array($$output) ? 'centro-ia' : 'fallback',
          'model' => is_array($$result) ? ($$result['model'] ?? null) : null,
          'execution_id' => is_array($$result) ? ($$result['execution_id'] ?? null) : null,
          'has_title' => is_array($$output) && !empty($$output['title']),
          'has_caption' => is_array($$output) && !empty($$output['caption']),
          'slides_count' => is_array($$output) ? count($$output['slides'] ?? []) : 0,
        ], JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL;
    networks:
      - vitrine_net

volumes:
  recovery_db_data:
  recovery_redis_data:
  recovery_vendor:
  recovery_storage:

networks:
  recovery_internal:
    name: vitrine_social_recovery_hml_internal
    internal: true
  traefik_public:
    external: true
    name: n8n-traefik_app_network
  vitrine_net:
    external: true
    name: vitrine_net
