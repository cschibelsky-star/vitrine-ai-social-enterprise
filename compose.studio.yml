services:
  studio_db:
    image: mariadb:11.4
    container_name: vitrine_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MARIADB_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MARIADB_ROOT_PASSWORD: "${SOCIAL_DB_ROOT_PASSWORD:?SOCIAL_DB_ROOT_PASSWORD is required}"
    volumes:
      - studio_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - vitrine_net

  studio_redis:
    image: redis:7-alpine
    container_name: vitrine_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command: ["sh", "-lc", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - studio_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vitrine_net

  studio_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - studio_vendor:/var/www/html/vendor
    depends_on:
      studio_db:
        condition: service_healthy
      studio_redis:
        condition: service_healthy
    networks:
      - vitrine_net

  studio_web:
    image: nginx:stable
    container_name: studio_web
    restart: unless-stopped
    depends_on:
      - studio_app
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vitrine_net

  studio_worker:
    depends_on:
      studio_db:
        condition: service_healthy
      studio_redis:
        condition: service_healthy
      studio_app:
        condition: service_started
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio_worker
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
    volumes:
      - ./:/var/www/html
      - studio_vendor:/var/www/html/vendor
    networks:
      - vitrine_net

  studio_scheduler:
    depends_on:
      studio_db:
        condition: service_healthy
      studio_redis:
        condition: service_healthy
      studio_app:
        condition: service_started
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio_scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: sh -lc 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
    volumes:
      - ./:/var/www/html
      - studio_vendor:/var/www/html/vendor
    networks:
      - vitrine_net

volumes:
  studio_db:
  studio_redis:
  studio_vendor:

networks:
  vitrine_net:
    external: true
